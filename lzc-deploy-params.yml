params:
  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "password for the admin panel and the first-run setup wizard, at least 8 characters"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_password:
      name: "管理员密码"
      description: "管理后台与首次初始化向导使用的密码，至少 8 位，部署时自动生成"
